<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Infinite Tsukuyomi</title>

    <style>

        body{
            margin:0;
            padding:0;

            background:linear-gradient(
                180deg,
                #3b0000,
                #8b0000
            );

            font-family:Arial, sans-serif;

            text-align:center;

            color:white;
        }

        .container{
            padding:40px 20px;
        }

        h1{

            font-size:7vw;

            text-shadow:
                0 0 10px black,
                0 0 20px crimson;

            margin-bottom:30px;
        }

        .card{

            width:90%;
            max-width:1000px;

            margin:auto;

            padding:30px;

            border-radius:25px;

            background:rgba(0,0,0,0.35);

            backdrop-filter:blur(8px);

            box-shadow:
                0 8px 25px rgba(0,0,0,0.5);
        }

        img{

            width:100%;
            max-width:900px;

            height:auto;

            border-radius:20px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.6);
        }

        .texto{

            font-size:25px;

            margin-top:20px;

            color:#ffe6e6;
        }

        .botao{

            display:inline-block;

            margin-top:30px;

            padding:18px 40px;

            background:black;

            color:white;

            text-decoration:none;

            border-radius:50px;

            font-size:22px;

            transition:0.3s;
        }

        .botao:hover{

            background:crimson;

            transform:scale(1.05);
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>
                First, buy me a COFFEE!!!
            </h1>

            <img src="Infinite_tsukuyomi.webp"
                 alt="Infinite Tsukuyomi">

        </div>

    </div>

</body>

</html>
