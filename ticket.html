<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Winner Ticket</title>

<style>

body{

    margin:0;

    font-family:Arial;

    background:
    linear-gradient(
        to bottom,
        #ffb6d9,
        #ff4f81
    );

    color:white;

    text-align:center;

    padding:25px;
}

.card{

    max-width:700px;

    margin:auto;

    background:rgba(255,255,255,0.15);

    padding:25px;

    border-radius:20px;

    box-shadow:
    0 5px 15px rgba(0,0,0,0.3);
}

h1{

    color:#ff003c;

    font-size:55px;

    text-shadow:
    2px 2px 10px rgba(0,0,0,0.4);
}

p{

    font-size:20px;

    line-height:1.5;
}

img{

    width:100%;

    max-width:600px;

    border-radius:20px;

    margin-top:20px;

    box-shadow:
    0 5px 15px rgba(0,0,0,0.4);
}

.botao{

    display:inline-block;

    margin-top:25px;

    padding:14px 30px;

    background:#ff003c;

    color:white;

    text-decoration:none;

    border-radius:40px;

    font-size:22px;

    font-weight:bold;
}

audio{

    width:90%;

    max-width:320px;

    margin-top:25px;
}

@media(max-width:700px){

    h1{
        font-size:38px;
    }

    p{
        font-size:17px;
    }

    .botao{
        font-size:18px;
    }
}

</style>

</head>

<body>

<div class="card">

    <h1>
        Congratulations!
    </h1>

    <p>
        You won a ticket for the
        <mark>Enhypen</mark> show!
    </p>

    <img src="enhypen.jpg"
         alt="Enhypen">

    <p>
        The event will happen next July
        in São Paulo.
    </p>

    <a href="mugen.html"
       class="botao">

       ENTER NOW

    </a>

    <br>

    <audio controls>

        <source src="Enhypen-Given-Taken.mp3"
                type="audio/mpeg">

    </audio>

</div>

</body>

</html>
