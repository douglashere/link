<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Winner Ticket</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial, sans-serif;

            background:linear-gradient(
                180deg,
                #ffb6d9,
                #ff7eb3
            );

            color:white;
            text-align:center;
        }

        .container{
            padding:40px 20px;
        }

        h1{
            font-size:9vw;
            color:#ff003c;

            text-shadow:
                2px 2px 10px rgba(0,0,0,0.3);

            margin-bottom:20px;
        }

        p{
            font-size:22px;
            max-width:800px;
            margin:auto;
            line-height:1.6;
        }

        .card{
            background:rgba(255,255,255,0.15);

            backdrop-filter:blur(10px);

            border-radius:25px;

            padding:30px;

            margin:auto;

            width:90%;
            max-width:900px;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.25);
        }

        img{
            margin-top:25px;

            width:100%;
            max-width:700px;

            border-radius:20px;

            box-shadow:
                0 8px 20px rgba(0,0,0,0.4);
        }

        .botao{
            display:inline-block;

            margin-top:30px;

            padding:18px 40px;

            background:#ff003c;

            color:white;

            text-decoration:none;

            font-size:24px;

            border-radius:50px;

            transition:0.3s;
        }

        .botao:hover{
            background:#b8002c;

            transform:scale(1.05);
        }

        audio{
            margin-top:35px;
            width:300px;
        }

        .shine{
            animation: brilho 2s infinite alternate;
        }

        @keyframes brilho{

            from{
                text-shadow:
                0 0 10px #fff,
                0 0 20px #ff0066;
            }

            to{
                text-shadow:
                0 0 20px #fff,
                0 0 40px #ff0066;
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <h1 class="shine">
                Congratulations!
            </h1>

            <p>
                We are pleased to inform that you won
                a ticket for the
                <mark>Enhypen</mark> show!!!
            </p>

            <img src="enhypen.jpg"
                 alt="Enhypen Blood Saga">

            <p style="margin-top:25px;">
                The event will take place next July
                in São Paulo.
            </p>

            <p>
                If you are craving for this unique
                opportunity, click on the button below.
            </p>

            <a href="mugen.html"
               class="botao">
               ENTER NOW
            </a>

            <br>

            <audio controls preload="auto">

                <source src="Enhypen-Given-Taken.mp3"
                        type="audio/mpeg">

            </audio>

        </div>

    </div>

</body>

</html>
