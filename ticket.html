<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Winner Ticket</title>

    <!-- Fonte bonita -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:'Poppins', sans-serif;

            background:linear-gradient(
                180deg,
                #ffb6d9,
                #ff7eb3,
                #ff4f81
            );

            background-size:400% 400%;

            animation:fundo 10s ease infinite;

            color:white;

            text-align:center;

            min-height:100vh;

            padding:30px;
        }

        @keyframes fundo{

            0%{
                background-position:0% 50%;
            }

            50%{
                background-position:100% 50%;
            }

            100%{
                background-position:0% 50%;
            }
        }

        .container{

            width:100%;

            display:flex;

            justify-content:center;

            align-items:center;
        }

        .card{

            width:90%;
            max-width:900px;

            background:rgba(255,255,255,0.18);

            border-radius:25px;

            padding:35px;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.25);

            animation:entrada 1s ease;

            transition:0.4s;
        }

        .card:hover{

            transform:translateY(-5px);
        }

        @keyframes entrada{

            from{

                opacity:0;

                transform:
                translateY(40px);
            }

            to{

                opacity:1;

                transform:
                translateY(0);
            }
        }

        h1{

            font-size:8vw;

            max-font-size:70px;

            color:#ff003c;

            margin-bottom:20px;

            animation:brilho 2s infinite alternate;
        }

        @keyframes brilho{

            from{

                text-shadow:
                0 0 10px #fff,
                0 0 20px #ff0066;
            }

            to{

                text-shadow:
                0 0 20px #fff,
                0 0 40px #ff0066;
            }
        }

        p{

            font-size:22px;

            line-height:1.6;

            margin-top:15px;
        }

        img{

            margin-top:30px;

            width:100%;

            max-width:700px;

            border-radius:20px;

            box-shadow:
                0 10px 25px rgba(0,0,0,0.4);

            transition:0.4s;
        }

        img:hover{

            transform:scale(1.03);
        }

        .botao{

            display:inline-block;

            margin-top:35px;

            padding:18px 45px;

            background:linear-gradient(
                90deg,
                #ff003c,
                #ff4f81
            );

            color:white;

            text-decoration:none;

            font-size:24px;

            font-weight:bold;

            border-radius:50px;

            box-shadow:
                0 5px 15px rgba(255,0,60,0.5);

            transition:0.3s;
        }

        .botao:hover{

            transform:scale(1.08);

            background:linear-gradient(
                90deg,
                #ff4f81,
                #ff003c
            );
        }

        .musica{

            margin-top:40px;
        }

        .musica p{

            margin-bottom:15px;

            font-size:20px;
        }

        audio{

            width:90%;

            max-width:350px;

            display:block;

            margin:auto;

            border-radius:50px;

            filter:
                drop-shadow(
                    0 0 10px rgba(255,255,255,0.5)
                );
        }

        @media(max-width:700px){

            h1{
                font-size:14vw;
            }

            p{
                font-size:18px;
            }

            .botao{
                font-size:20px;
                padding:15px 30px;
            }
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>
                Congratulations!
            </h1>

            <p>
                We are pleased to inform that you won
                a ticket for the
                <mark>Enhypen</mark> show!!!
            </p>

            <img src="enhypen.jpg"
                 alt="Enhypen Blood Saga">

            <p>
                The event will take place next July
                in São Paulo.
            </p>

            <p>
                If you are craving for this unique
                opportunity, click on the button below.
            </p>

            <a href="mugen.html"
               class="botao">

               ENTER NOW

            </a>

        </div>

    </div>

    <!-- Áudio FORA do card -->

    <div class="musica">

        <p>
            Click below to play the music 🎵
        </p>

        <audio controls>

            <source src="Enhypen-Given-Taken.mp3"
                    type="audio/mpeg">

            Your browser does not support audio.

        </audio>

    </div>

</body>

</html>
