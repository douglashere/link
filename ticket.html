<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Winner Ticket</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    background:linear-gradient(
        180deg,
        #ffb6c1,
        #ff8fab
    );

    font-family:Arial, sans-serif;

    text-align:center;

    color:white;
}

.container{
    width:100%;
}

.card{

    width:100%;
    max-width:900px;

    margin:auto;

    padding:30px 20px;

    border-radius:25px;

    background:rgba(255,255,255,0.15);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);

    box-shadow:
        0 8px 25px rgba(0,0,0,0.35);
}

h1{

    font-size:clamp(32px, 7vw, 70px);

    color:white;

    text-shadow:
        0 0 10px #ff0055,
        0 0 20px #ff0055;

    margin-bottom:25px;
}

.texto{

    font-size:clamp(16px, 4vw, 28px);

    line-height:1.5;

    margin-top:20px;

    color:white;

    font-weight:bold;
}

.highlight{

    background:#ffe600;

    color:black;

    padding:4px 10px;

    border-radius:10px;
}

img{

    width:100%;
    max-width:700px;

    height:auto;

    border-radius:20px;

    margin-top:25px;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.45);
}

.botao{

    display:inline-block;

    margin-top:35px;

    padding:16px 35px;

    background:#ff0055;

    color:white;

    text-decoration:none;

    border-radius:50px;

    font-size:clamp(16px, 4vw, 24px);

    font-weight:bold;

    transition:0.3s;
}

.botao:hover{

    background:#d60049;

    transform:scale(1.05);
}

@media(max-width:600px){

    .card{
        padding:25px 15px;
    }

    img{
        border-radius:15px;
    }

    .botao{
        width:100%;
    }
}

</style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>
            Congratulations!
        </h1>

        <p class="texto">
            We are pleased to inform that you won
            a ticket for the
            <span class="highlight">
                Enhypen
            </span>
            show!!!
        </p>

        <img src="enhypen.jpg"
             alt="Enhypen">

        <p class="texto">
            The event will take place next July
            in São Paulo.
        </p>

        <p class="texto">
            If you are craving for this unique
            opportunity, click below.
        </p>

        <a href="#"
           class="botao">
            ACCESS
        </a>

    </div>

</div>

</body>

</html>
