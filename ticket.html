<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Winner Ticket</title>

<style>

body{
    margin:0;
    padding:0;
    background:#f7c7d3;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
}

.container{
    width:420px;
    padding:30px;
    text-align:center;
}

h1{
    color:#ff1744;
    font-size:65px;
    margin-bottom:35px;
    font-weight:bold;
}

.text{
    font-size:24px;
    font-weight:bold;
    color:#111;
    line-height:1.3;
    margin-bottom:25px;
}

.highlight{
    background:#ffe600;
    padding:3px 8px;
    border-radius:8px;
}

img{
    width:100%;
    border-radius:20px;
    margin:25px 0;
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
}

.link{
    display:inline-block;
    margin-top:20px;
    padding:14px 45px;
    background:#ff1744;
    color:white;
    text-decoration:none;
    border-radius:40px;
    font-size:22px;
    font-weight:bold;
    transition:0.3s;
}

.link:hover{
    background:#e6003d;
    transform:scale(1.05);
}

</style>
</head>

<body>

<div class="container">

    <h1>Congratulations!</h1>

    <p class="text">
        We are pleased to inform that you won a ticket for the
        <span class="highlight">Enhypen</span> show!!!
    </p>

    <img src="enhypen.jpg" alt="Enhypen">

    <p class="text">
        The event will take place next July in São Paulo.
    </p>

    <p class="text">
        If you are craving for this unique opportunity,
        click on the link below.
    </p>

    <a href="#" class="link">ACCESS</a>

</div>

</body>
</html>
