<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Winner Ticket</title>

    <style>

        body{
            margin:0;
            padding:0;

            background:linear-gradient(
                180deg,
                #ffb6c1,
                #ff8fab
            );

            font-family:Arial, sans-serif;

            text-align:center;

            color:white;
        }

        .container{
            padding:40px 20px;
        }

        h1{

            font-size:7vw;

            text-shadow:
                0 0 10px #ff0055,
                0 0 20px #ff0055;

            margin-bottom:30px;
        }

        .card{

            width:90%;
            max-width:1000px;

            margin:auto;

            padding:30px;

            border-radius:25px;

            background:rgba(255,255,255,0.15);

            backdrop-filter:blur(8px);

            box-shadow:
                0 8px 25px rgba(0,0,0,0.35);
        }

        img{

            width:100%;
            max-width:900px;

            height:auto;

            border-radius:20px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.45);
        }

        .texto{

            font-size:25px;

            margin-top:20px;

            color:white;

            font-weight:bold;
        }

        .highlight{

            background:#ffe600;

            color:black;

            padding:4px 10px;

            border-radius:10px;
        }

        .botao{

            display:inline-block;

            margin-top:30px;

            padding:18px 40px;

            background:#ff0055;

            color:white;

            text-decoration:none;

            border-radius:50px;

            font-size:22px;

            transition:0.3s;
        }

        .botao:hover{

            background:#d60049;

            transform:scale(1.05);
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>
                Congratulations!!!
            </h1>

            <p class="texto">
                We are pleased to inform that you won
                a ticket for the
                <span class="highlight">
                    Enhypen
                </span>
                show!!!
            </p>

            <img src="enhypen.jpg"
                 alt="Enhypen">

            <p class="texto">
                The event will take place next July
                in São Paulo.
            </p>

            <p class="texto">
                If you are craving for this unique
                opportunity, click below.
            </p>

            <a href="#"
               class="botao">
                ACCESS
            </a>

        </div>

    </div>

</body>

</html>
