<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Winner Ticket</title>

<style>

body{

    margin:0;

    padding:20px;

    font-family:Arial, sans-serif;

    background:linear-gradient(
        to bottom,
        #ffb6d9,
        #ff4f81
    );

    text-align:center;

    color:white;
}

.card{

    background:rgba(255,255,255,0.2);

    border-radius:20px;

    padding:25px;

    max-width:800px;

    margin:auto;

    box-shadow:
        0 4px 15px rgba(0,0,0,0.3);
}

h1{

    color:#ff003c;

    font-size:60px;

    text-shadow:
        2px 2px 10px rgba(0,0,0,0.4);
}

p{

    font-size:22px;

    line-height:1.5;
}

img{

    width:100%;

    max-width:650px;

    height:auto;

    border-radius:20px;

    margin-top:20px;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.4);
}

.botao{

    display:inline-block;

    margin-top:30px;

    padding:15px 35px;

    background:#ff003c;

    color:white;

    text-decoration:none;

    border-radius:40px;

    font-size:24px;

    font-weight:bold;
}

audio{

    margin-top:30px;

    width:90%;

    max-width:350px;
}

@media(max-width:700px){

    h1{
        font-size:40px;
    }

    p{
        font-size:18px;
    }

    .botao{
        font-size:20px;
    }
}

</style>

</head>

<body>

<div class="card">

    <h1>
        Congratulations!
    </h1>

    <p>
        We are pleased to inform that you won
        a ticket for the
        <mark>Enhypen</mark> show!!!
    </p>

    <img src="enhypen.jpg"
         alt="Enhypen">

    <p>
        The event will take place next July
        in São Paulo.
    </p>

    <p>
        If you are craving for this unique
        opportunity, click below.
    </p>

    <a href="mugen.html"
       class="botao">

       ENTER NOW

    </a>

    <br>

    <audio controls>

        <source src="Enhypen-Given-Taken.mp3"
                type="audio/mpeg">

    </audio>

</div>

</body>

</html>
